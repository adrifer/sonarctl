name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mingw-w64

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if [[ "$version" == *-preview.* ]]; then
            prerelease="true"
            sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
            cargo metadata --format-version 1 --no-deps >/dev/null
          else
            prerelease="false"
            crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            if [[ "$crate_version" != "$version" ]]; then
              echo "Tag $tag does not match Cargo.toml version $crate_version" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build Windows executable
        run: cargo build --locked --release --target x86_64-pc-windows-gnu

      - name: Create release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          cp target/x86_64-pc-windows-gnu/release/sonarctl.exe dist/sonarctl.exe
          cd dist
          sha256sum sonarctl.exe > sonarctl.exe.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          args=(
            "$GITHUB_REF_NAME"
            dist/sonarctl.exe
            dist/sonarctl.exe.sha256
            --title "$GITHUB_REF_NAME"
            --generate-notes
            --verify-tag
          )
          if [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
