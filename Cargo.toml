[package]
name = "sonarctl"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
wiremock = "0.6.5"

[features]
# Opt-in tests that talk to a locally running SteelSeries Sonar installation.
sonar-integration = []
